[project]
name = "ai-tutor-backend"
version = "0.1.0"
description = "AI Tutor Dashboard backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    "anthropic>=2.4",
    "groq>=1.7",
    # Gnani speech calls, and decoding browser recordings (WebM/Opus) to WAV for Gnani STT.
    "httpx>=0.27",
    # Loose bound: manim (video worker) needs av<14; the API server can use the newest.
    "av>=12",
    # Checking and converting downloaded pictures for videos (manim needs it too).
    "pillow>=11",
    "arq==0.26.3",
]

[project.optional-dependencies]
# Installed only in the video worker image (docker/video-worker.Dockerfile).
video = [
    "manim==0.19.0",
    # manim 0.19 builds images with Image.fromarray(..., mode="RGBA") on data Pillow 12+
    # rejects (ValueError, and the render then hangs). Keep the worker on Pillow 11.
    "pillow>=11,<12",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "httpx-ws>=0.7",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: requires running Postgres and Redis (docker compose up -d)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerate output is kept close to its generated form for easy review.
"alembic/versions/*" = ["E501"]
