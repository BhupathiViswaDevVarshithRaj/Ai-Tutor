name: ai-tutor

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aitutor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aitutor_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aitutor}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Renders explainer videos (Phase 12). Opt-in so `docker compose up` stays fast:
  #   docker compose --profile video up -d --build video-worker
  video-worker:
    profiles: ["video"]
    build:
      context: .
      dockerfile: docker/video-worker.Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network, not the host's published ports.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /media
    volumes:
      # Shared with the API, which serves the finished files from ./media.
      - ./media:/media
      # Live code: restart the worker after changing backend/app (no rebuild needed).
      - ./backend/app:/app/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
